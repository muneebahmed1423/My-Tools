<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clerical Jobs Tool</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='4' width='20' height='24' rx='3' fill='%230c1525' stroke='%2300c4a7' stroke-width='2'/%3E%3Cline x1='10' y1='11' x2='22' y2='11' stroke='%2300c4a7' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='10' y1='16' x2='22' y2='16' stroke='%2300c4a7' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='10' y1='21' x2='17' y2='21' stroke='%2300c4a7' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:             #070c18;
    --surface:        #0c1525;
    --surface-2:      #102030;
    --surface-3:      #152840;
    --border:         #1a3050;
    --border-hover:   #2a4a6e;
    --border-glow:    #00c4a740;
    --text-primary:   #d8eeff;
    --text-secondary: #6a90b0;
    --text-muted:     #1e3550;
    --accent:         #00c4a7;
    --accent-soft:    #00c4a718;
    --accent-dim:     #0a6458;
    --amber:          #f0a840;
    --amber-soft:     #f0a84018;
    --amber-dim:      #7a5010;
    --violet:         #a78bfa;
    --violet-soft:    #a78bfa18;
    --violet-dim:     #4c2d8a;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Syne', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.25rem 3rem;
  }

  /* Grid texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 52px 52px;
    opacity: 0.22;
    pointer-events: none;
    z-index: 0;
  }

  /* Radial glow */
  body::after {
    content: '';
    position: fixed;
    bottom: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 400px;
    background: radial-gradient(ellipse, #00c4a710 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 500px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 2.2rem;
    animation: fadeUp 0.6s ease both;
  }

  .header-icon {
    width: 40px; height: 40px;
    margin: 0 auto 14px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-dim);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }

  .header-icon svg { width: 20px; height: 20px; stroke: var(--accent); }

  .header-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    color: var(--accent-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .header-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.03em;
    line-height: 1.25;
  }

  .header-title span { color: var(--accent); }

  .header-line {
    width: 32px; height: 1px;
    background: var(--accent-dim);
    margin: 16px auto 0;
    opacity: 0.6;
  }

  /* ── Tab bar ── */
  .tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    animation: fadeUp 0.6s 0.05s ease both;
  }

  .tab-btn {
    flex: 1;
    padding: 9px 8px;
    border: none;
    background: transparent;
    border-radius: 11px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }

  .tab-btn svg { width: 12px; height: 12px; stroke: currentColor; flex-shrink: 0; }

  .tab-btn.active {
    background: var(--surface-3);
    color: var(--accent);
    border: 1px solid var(--border-hover);
    box-shadow: 0 0 0 1px var(--border-glow);
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.6rem;
    margin-bottom: 1rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .card:hover { border-color: var(--border-hover); box-shadow: 0 0 0 1px var(--border-glow), 0 8px 32px #00000040; }
  .card:hover::before { opacity: 1; }

  .card-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-dim);
    margin-bottom: 1.1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-eyebrow::before {
    content: '';
    width: 3px; height: 3px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Field ── */
  .field { margin-bottom: 10px; }

  .field label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .field input,
  .field textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: vertical;
  }

  .field input:focus,
  .field textarea:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 1px var(--border-glow);
  }

  .field textarea {
    min-height: 110px;
    line-height: 1.6;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.1rem 0;
  }

  /* ── Button ── */
  .btn {
    width: 100%;
    padding: 11px 18px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-secondary);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s, box-shadow 0.2s;
  }

  .btn svg { width: 14px; height: 14px; stroke: currentColor; opacity: 0.75; }

  .btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent-dim);
    color: var(--accent);
    box-shadow: 0 0 0 1px var(--border-glow);
  }

  .btn:active { transform: scale(0.98); }

  /* ── Result boxes ── */
  .result-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1.2rem;
    margin-top: 1rem;
    transition: border-color 0.3s;
  }

  .result-box.has-result {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 1px var(--border-glow);
  }

  .result-label {
    font-family: 'DM Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-dim);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .result-label::before {
    content: '';
    width: 3px; height: 3px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Numbers to Words result */
  .ntw-result-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
    line-height: 1.5;
    word-break: break-word;
  }

  .ntw-placeholder {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  /* Word count big number */
  .wc-count-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    margin-bottom: 0.8rem;
  }

  .wc-big {
    font-size: 52px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.05em;
    line-height: 1;
  }

  .wc-unit {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    padding-bottom: 10px;
  }

  .wc-placeholder {
    font-size: 44px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: -0.05em;
    line-height: 1;
  }

  /* Pill row for word count */
  .pill-row {
    display: flex;
    gap: 8px;
    margin-top: 0.7rem;
  }

  .pill {
    flex: 1;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    transition: border-color 0.25s;
  }

  .pill:hover { border-color: var(--accent-dim); }

  .pill-val {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .pill-key {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.12em;
    color: var(--text-secondary);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Capital converter result */
  .cap-result-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 0.06em;
    line-height: 1.5;
    word-break: break-word;
  }

  .cap-placeholder {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  /* Copy button (small) */
  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }

  .copy-btn svg { width: 11px; height: 11px; stroke: currentColor; }

  .copy-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .copy-btn.copied { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }

  /* Live badge */
  .live-badge {
    display: none;
    align-items: center;
    gap: 5px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.7rem;
  }

  .live-badge.show { display: flex; }

  .live-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.8s ease infinite;
  }

  /* Error */
  .error-msg {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #f06060;
    background: #f0606012;
    border: 1px solid #f0606030;
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: 10px;
    letter-spacing: 0.06em;
  }

  /* Section visibility */
  .section { display: none; }
  .section.active { display: block; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 2rem;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    animation: fadeUp 0.6s 0.4s ease both;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes numIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.7); }
  }

  .animate-in { animation: numIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both; }

  .card:nth-child(1) { animation: fadeUp 0.6s 0.1s ease both; }
  .card:nth-child(2) { animation: fadeUp 0.6s 0.2s ease both; }

  /* Responsive */
  @media (max-width: 480px) {
    .wc-big { font-size: 38px; }
    .wc-placeholder { font-size: 32px; }
    .tab-btn { font-size: 8px; gap: 4px; padding: 9px 5px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- ── Header ── -->
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2"/>
        <line x1="8" y1="8" x2="16" y2="8"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
        <line x1="8" y1="16" x2="12" y2="16"/>
      </svg>
    </div>
    <div class="header-eyebrow">Utility Suite</div>
    <div class="header-title">Clerical <span>Jobs Tool</span></div>
    <div class="header-line"></div>
  </div>

  <!-- ── Tab bar ── -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-btn-ntw" onclick="switchTab('ntw')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h4M4 12h6M4 17h3"/>
        <path d="M14 7l2 2 4-4"/>
        <path d="M14 12l2 2 4-4"/>
        <path d="M14 17l2 2 4-4"/>
      </svg>
      Num → Words
    </button>
    <button class="tab-btn" id="tab-btn-wc" onclick="switchTab('wc')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5h18M3 10h12M3 15h9M3 20h6"/>
      </svg>
      Word Count
    </button>
    <button class="tab-btn" id="tab-btn-cap" onclick="switchTab('cap')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6l4-4 4 4"/>
        <line x1="8" y1="2" x2="8" y2="14"/>
        <path d="M13 6h7M13 10h5M13 14h7"/>
      </svg>
      Capitals
    </button>
  </div>

  <!-- ══════════════════════════════════════
       TAB 1 — Numbers to Words
  ══════════════════════════════════════ -->
  <div class="section active" id="tab-ntw">
    <div class="card">
      <div class="card-eyebrow">Numbers to Words Converter</div>

      <div id="ntw-live-badge" class="live-badge">
        <div class="live-dot"></div>
        converted
      </div>

      <div class="field">
        <label>Enter a number</label>
        <input
          type="number"
          id="ntw-input"
          placeholder="e.g. 1000"
          onkeydown="if(event.key==='Enter') convertNTW()"
          autocomplete="off"
        />
      </div>

      <div id="ntw-error"></div>
      <div class="divider"></div>

      <button class="btn" onclick="convertNTW()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        Convert to Words
      </button>

      <div class="result-box" id="ntw-result-box">
        <div class="result-label">Result in words</div>
        <div id="ntw-result-inner">
          <div class="ntw-placeholder">—</div>
        </div>
        <button class="copy-btn" id="ntw-copy-btn" style="display:none" onclick="copyResult('ntw')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          Copy
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       TAB 2 — Word Count
  ══════════════════════════════════════ -->
  <div class="section" id="tab-wc">
    <div class="card">
      <div class="card-eyebrow">Word Counting Tool</div>

      <div id="wc-live-badge" class="live-badge">
        <div class="live-dot"></div>
        counted
      </div>

      <div class="field">
        <label>Paste your text here</label>
        <textarea
          id="wc-input"
          placeholder="Paste or type any text to count every word, including connector words like 'and', 'the', 'of'…"
        ></textarea>
      </div>

      <div id="wc-error"></div>
      <div class="divider"></div>

      <button class="btn" onclick="countWords()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5h18M3 10h12M3 15h9M3 20h6"/>
        </svg>
        Count Words
      </button>

      <div class="result-box" id="wc-result-box">
        <div class="result-label">Word count result</div>
        <div id="wc-result-inner">
          <div class="wc-count-row">
            <div class="wc-placeholder">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       TAB 3 — Capital Converter
  ══════════════════════════════════════ -->
  <div class="section" id="tab-cap">
    <div class="card">
      <div class="card-eyebrow">Capital Converter</div>

      <div id="cap-live-badge" class="live-badge">
        <div class="live-dot"></div>
        converted
      </div>

      <div class="field">
        <label>Enter word or line</label>
        <textarea
          id="cap-input"
          placeholder="e.g. hello world"
          style="min-height:80px"
        ></textarea>
      </div>

      <div id="cap-error"></div>
      <div class="divider"></div>

      <button class="btn" onclick="convertCap()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6l4-4 4 4"/>
          <line x1="8" y1="2" x2="8" y2="14"/>
          <path d="M13 6h7M13 10h5M13 14h7"/>
        </svg>
        Convert to Capitals
      </button>

      <div class="result-box" id="cap-result-box">
        <div class="result-label">Capitalised output</div>
        <div id="cap-result-inner">
          <div class="cap-placeholder">—</div>
        </div>
        <button class="copy-btn" id="cap-copy-btn" style="display:none" onclick="copyResult('cap')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          Copy
        </button>
      </div>
    </div>
  </div>

  <!-- ── Footer ── -->
  <div class="footer">Clerical Jobs Tool &nbsp;·&nbsp; three utilities</div>

</div><!-- /wrapper -->

<script>
/* ── Tab switching ── */
function switchTab(tab) {
  ['ntw','wc','cap'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('tab-btn-' + t).classList.toggle('active', t === tab);
  });
}

/* ══════════════════════════════════════════════
   TOOL 1 — Numbers to Words
══════════════════════════════════════════════ */
const ones = ['','one','two','three','four','five','six','seven','eight','nine',
              'ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen',
              'seventeen','eighteen','nineteen'];
const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

function numToWords(n) {
  if (n === 0) return 'zero';
  if (n < 0) return 'negative ' + numToWords(-n);

  let result = '';

  if (n >= 1e15) {
    result += numToWords(Math.floor(n / 1e15)) + ' quadrillion ';
    n %= 1e15;
  }
  if (n >= 1e12) {
    result += numToWords(Math.floor(n / 1e12)) + ' trillion ';
    n %= 1e12;
  }
  if (n >= 1e9) {
    result += numToWords(Math.floor(n / 1e9)) + ' billion ';
    n %= 1e9;
  }
  if (n >= 1e6) {
    result += numToWords(Math.floor(n / 1e6)) + ' million ';
    n %= 1e6;
  }
  if (n >= 1000) {
    result += numToWords(Math.floor(n / 1000)) + ' thousand ';
    n %= 1000;
  }
  if (n >= 100) {
    result += ones[Math.floor(n / 100)] + ' hundred ';
    n %= 100;
  }
  if (n >= 20) {
    result += tens[Math.floor(n / 10)] + (n % 10 ? '-' + ones[n % 10] : '') + ' ';
    n = 0;
  } else if (n > 0) {
    result += ones[n] + ' ';
  }

  return result.trim();
}

function numToWordsDecimal(raw) {
  const isNeg = raw.trim().startsWith('-');
  const absRaw = raw.trim().replace('-','').trim();
  const parts = absRaw.split('.');

  const intPart = parseInt(parts[0], 10);
  let words = numToWords(intPart);

  if (parts.length > 1 && parts[1] !== '') {
    // read decimal digits individually
    const decDigits = parts[1].split('').map(d => ones[parseInt(d,10)] || 'zero').join(' ');
    words += ' point ' + decDigits;
  }

  return (isNeg ? 'negative ' : '') + words;
}

let ntwResult = '';

function convertNTW() {
  const raw = document.getElementById('ntw-input').value.trim();
  const errEl = document.getElementById('ntw-error');
  errEl.innerHTML = '';

  if (raw === '') {
    errEl.innerHTML = '<div class="error-msg">↳ please enter a number before converting.</div>';
    return;
  }

  if (!/^-?\d+(\.\d+)?$/.test(raw)) {
    errEl.innerHTML = '<div class="error-msg">↳ invalid input — please enter a valid number (e.g. 1000 or 3.14).</div>';
    return;
  }

  const num = parseFloat(raw);
  if (Math.abs(num) > 999999999999999) {
    errEl.innerHTML = '<div class="error-msg">↳ number is too large — maximum supported is 999 quadrillion.</div>';
    return;
  }

  ntwResult = numToWordsDecimal(raw);

  const inner = document.getElementById('ntw-result-inner');
  inner.innerHTML = `<div class="ntw-result-text animate-in">${ntwResult.charAt(0).toUpperCase() + ntwResult.slice(1)}</div>`;

  document.getElementById('ntw-result-box').classList.add('has-result');
  document.getElementById('ntw-copy-btn').style.display = 'inline-flex';
  document.getElementById('ntw-live-badge').classList.add('show');
}

/* ══════════════════════════════════════════════
   TOOL 2 — Word Count
══════════════════════════════════════════════ */
function countWords() {
  const text = document.getElementById('wc-input').value;
  const errEl = document.getElementById('wc-error');
  errEl.innerHTML = '';

  if (text.trim() === '') {
    errEl.innerHTML = '<div class="error-msg">↳ please paste some text before counting.</div>';
    return;
  }

  // Count words: split on whitespace, filter empty
  const words = text.trim().split(/\s+/).filter(w => w.length > 0);
  const wordCount = words.length;

  // Extra stats
  const charCount = text.length;
  const charNoSpace = text.replace(/\s/g, '').length;
  const sentenceCount = (text.match(/[.!?]+/g) || []).length;

  const inner = document.getElementById('wc-result-inner');
  inner.innerHTML = `
    <div class="wc-count-row animate-in">
      <div class="wc-big">${wordCount.toLocaleString()}</div>
      <div class="wc-unit">word${wordCount !== 1 ? 's' : ''}<br>total</div>
    </div>
    <div class="pill-row animate-in">
      <div class="pill">
        <div class="pill-val">${charCount.toLocaleString()}</div>
        <div class="pill-key">Characters</div>
      </div>
      <div class="pill">
        <div class="pill-val">${charNoSpace.toLocaleString()}</div>
        <div class="pill-key">No Spaces</div>
      </div>
      <div class="pill">
        <div class="pill-val">${sentenceCount.toLocaleString()}</div>
        <div class="pill-key">Sentences</div>
      </div>
    </div>
  `;

  document.getElementById('wc-result-box').classList.add('has-result');
  document.getElementById('wc-live-badge').classList.add('show');
}

/* ══════════════════════════════════════════════
   TOOL 3 — Capital Converter
══════════════════════════════════════════════ */
let capResult = '';

function convertCap() {
  const text = document.getElementById('cap-input').value;
  const errEl = document.getElementById('cap-error');
  errEl.innerHTML = '';

  if (text.trim() === '') {
    errEl.innerHTML = '<div class="error-msg">↳ please enter some text before converting.</div>';
    return;
  }

  capResult = text.toUpperCase();

  const inner = document.getElementById('cap-result-inner');
  inner.innerHTML = `<div class="cap-result-text animate-in">${escapeHtml(capResult)}</div>`;

  document.getElementById('cap-result-box').classList.add('has-result');
  document.getElementById('cap-copy-btn').style.display = 'inline-flex';
  document.getElementById('cap-live-badge').classList.add('show');
}

/* ── Copy helpers ── */
function copyResult(tool) {
  const text = tool === 'ntw' ? ntwResult : capResult;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(tool + '-copy-btn');
    btn.classList.add('copied');
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Copied!
    `;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        Copy
      `;
    }, 2000);
  }).catch(() => {
    /* Fallback for older browsers */
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
